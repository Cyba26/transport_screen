name: APK Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Compiler l'APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk transport-screen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: transport-screen-apk
          path: android/transport-screen.apk

      # Sur main : publie l'APK à une adresse fixe, téléchargeable directement depuis le téléphone
      # https://github.com/<owner>/<repo>/releases/download/android-latest/transport-screen.apk
      - name: Publier la release android-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest transport-screen.apk \
            --target "$GITHUB_SHA" \
            --title "APK Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "Dernier APK construit depuis main (${GITHUB_SHA::7})."
